<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

model-viewer{
    width:100%;
    height:100%;
    background:#f5f5f5;
}

#progress-bar{
    position:absolute;
    width:0%;
    height:4px;
    background:#2196F3;
    top:0;
    left:0;
}

#error{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:#ff5252;
    color:white;
    padding:10px 15px;
    border-radius:5px;
    display:none;
}

#ar-button{
    background:#1976D2;
    color:white;
    border:none;
    border-radius:6px;
    padding:12px 20px;
    font-size:16px;
}
</style>

</head>

<body>

<div id="progress-bar"></div>
<div id="error">Failed to load 3D model.</div>

<model-viewer
id="viewer"
src="realistic_human_lungs.glb"
alt="Human Lungs"
camera-controls
auto-rotate
ar
ar-modes="scene-viewer webxr quick-look"
shadow-intensity="1"
exposure="1"
loading="eager">

<button slot="ar-button" id="ar-button">
View in Your Space
</button>

</model-viewer>

<script>

const viewer=document.querySelector("#viewer");
const progress=document.querySelector("#progress-bar");
const error=document.querySelector("#error");

viewer.addEventListener("progress",(event)=>{
progress.style.width=(event.detail.totalProgress*100)+"%";
});

viewer.addEventListener("load",()=>{
progress.style.display="none";
});

viewer.addEventListener("error",()=>{
error.style.display="block";
});

</script>

</body>
</html>
