<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

model-viewer{
    width:100%;
    height:100%;
    background:#f5f5f5;
}

/* Progress Bar */

#progress-bar{
    position:absolute;
    width:0%;
    height:4px;
    background:#2196F3;
    top:0;
    left:0;
}

/* Error */

#error{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:#ff5252;
    color:white;
    padding:10px 15px;
    border-radius:5px;
    display:none;
}

/* AR Button */

#ar-button{
    background:#1976D2;
    color:white;
    border:none;
    border-radius:6px;
    padding:12px 20px;
    font-size:16px;
}

/* Information Panel */

#infoBox{

position:absolute;

bottom:20px;

left:20px;

width:320px;

background:white;

padding:15px;

border-radius:10px;

box-shadow:0 0 10px rgba(0,0,0,0.3);

z-index:100;

}

/* Labels */

.label{

position:absolute;

background:#1976D2;

color:white;

padding:8px 12px;

border-radius:20px;

cursor:pointer;

font-weight:bold;

border:none;

z-index:100;

transition:0.3s;

}

.label:hover{

background:#0D47A1;

}

/* Temporary Position */

#tracheaLabel{

top:80px;

left:52%;

transform:translateX(-50%);

}

</style>

</head>

<body>

<div id="progress-bar"></div>

<div id="error">

Failed to load 3D model.

</div>

<model-viewer

id="viewer"

src="realistic_human_lungs.glb"

alt="Human Lungs"

camera-controls

auto-rotate

ar

ar-modes="scene-viewer webxr quick-look"

shadow-intensity="1"

exposure="1"

loading="eager">

<button slot="ar-button" id="ar-button">

View in Your Space

</button>

</model-viewer>

<!-- Label -->

<button id="tracheaLabel" class="label">

Trachea

</button>

<!-- Information Panel -->

<div id="infoBox">

<h2>Human Respiratory System</h2>

<p>

Click the <b>Trachea</b> label to learn about that structure.

</p>

</div>

<script>

const viewer=document.querySelector("#viewer");

const progress=document.querySelector("#progress-bar");

const error=document.querySelector("#error");

const info=document.querySelector("#infoBox");

const trachea=document.querySelector("#tracheaLabel");

viewer.addEventListener("progress",(event)=>{

progress.style.width=(event.detail.totalProgress*100)+"%";

});

viewer.addEventListener("load",()=>{

progress.style.display="none";

});

viewer.addEventListener("error",()=>{

error.style.display="block";

});

trachea.onclick=function(){

info.innerHTML=`

<h2>Trachea (Windpipe)</h2>

<p>

<b>Function:</b>

The trachea is the main airway that carries air

from the nose and mouth to the lungs.

It is supported by C-shaped cartilage rings

which keep the airway open during breathing.

</p>

`;

};

</script>

</body>

</html>
